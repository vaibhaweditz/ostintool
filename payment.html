<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSTIN TOOL - Payment</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
    url('bg.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #00ff88;
}

.logo{
    color:#00ff88;
    font-size:28px;
    font-weight:bold;
}

.user{
    font-weight:bold;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
}

.payment-box{
    width:100%;
    max-width:500px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:30px;
    border:1px solid rgba(255,255,255,0.15);
}

h1{
    text-align:center;
    color:#00ff88;
    margin-bottom:20px;
}

.qr{
    text-align:center;
    margin-bottom:25px;
}

.qr img{
    width:250px;
    max-width:100%;
    background:white;
    padding:10px;
    border-radius:10px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
}

select,input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#00ff88;
    color:black;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

</style>
</head>
<body>

<div class="navbar">
    <div class="logo">OSTIN TOOL</div>
    <div class="user">👤 Vaibhaw11</div>
</div>

<div class="container">

<div class="payment-box">

<h1>Payment Verification</h1>

<div class="qr">
    <img src="qr.png" alt="QR Code">
</div>

<label>Select Plan</label>
<select id="plan">
    <option value="">Choose Plan</option>
    <option value="Basic">Basic - ₹600</option>
    <option value="Standard">Standard - ₹1000</option>
    <option value="Premium">Premium - ₹2000</option>
</select>

<label>Enter UTR Number</label>
<input type="text" id="utr" placeholder="Enter UTR Number">

<button onclick="submitPayment()">
    Submit Payment
</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBNykKcPCVMsjLKNhlVXkkX9FslCWftsPI",
  authDomain: "ostin-ca3e8.firebaseapp.com",
  projectId: "ostin-ca3e8",
  storageBucket: "ostin-ca3e8.firebasestorage.app",
  messagingSenderId: "992405557523",
  appId: "1:992405557523:web:d4c2ea40e5d86709958ae6",
  measurementId: "G-XQ3GEM55TH"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.submitPayment = async function(){

    const plan = document.getElementById("plan").value;
    const utr = document.getElementById("utr").value;

    if(!plan || !utr){
        alert("Please fill all fields.");
        return;
    }

    try{

        await addDoc(collection(db, "payments"), {
            username: "Vaibhaw11",
            plan: plan,
            utr: utr,
            status: "Pending",
            date: new Date().toLocaleString()
        });

        alert("✅ Payment Submitted Successfully!\n\nKindly wait 15 minutes for verification.");

        document.getElementById("plan").value = "";
        document.getElementById("utr").value = "";

    }catch(error){
        alert("Error: " + error.message);
    }

}

</script>

</body>
</html>
